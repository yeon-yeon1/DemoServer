spring:
  application:
    name: duksungmap
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mail:
    host: ${SMTP_HOST}
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  auth:
    email-domain: duksung.ac.kr
    verification-ttl-seconds: 300
    refresh-ttl-days: 30
    access-ttl-minutes: 15
    refresh-cookie-name: refresh_token
    rate-limit:
      resend-cooldown-seconds: 60
      max-sends-per-email-daily: 5
      # 교내 와이파이는 NAT라 수백 명이 공인 IP 하나를 공유하고, Vercel 프록시를
      # 거치면서 IP가 더 뭉칠 수도 있다. 정상 사용자를 막지 않도록 느슨하게 두고,
      # 실질적인 상한은 아래 전역 한도가 담당한다.
      max-sends-per-ip-hourly: 100
      # SMTP 일일 할당량보다 낮게 잡아 계정이 잠기는 상황을 막는다.
      max-sends-global-daily: 400
      max-verify-attempts: 5
    cookie-secure: ${COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET}
  mail:
    logo-path: static/images/logo.png